name: nlT-Structures
version: '${version}'
main: com.nltarzan.structures.NltStructuresPlugin
api-version: '${apiVersion}'
description: Custom-built versions of vanilla structures that reset with a new random layout after a player has cleared them.
author: nlTarzan

permissions:
  nltstructures.admin:
    description: Use /nltstructures and receive the structures' broadcast messages. Grant it with a permissions plugin such as LuckPerms.
    default: false
