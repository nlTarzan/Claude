<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nlT-Structures - code walkthrough</title>
<style>
  @page {
    size: A4;
    margin: 18mm 16mm 20mm 16mm;
    @bottom-center { content: "nlT-Structures code walkthrough  -  page " counter(page) " of " counter(pages); font: 8pt "Segoe UI", Arial, sans-serif; color: #888; }
  }
  @page :first { @bottom-center { content: none; } }
  body { font: 10pt/1.5 "Segoe UI", Calibri, Arial, sans-serif; color: #1d2329; }
  h1 { font-size: 20pt; color: #0b5d6b; border-bottom: 2px solid #0b5d6b; padding-bottom: 4px; margin: 0 0 12px; page-break-before: always; }
  h2 { font-size: 14pt; color: #0b5d6b; margin: 22px 0 6px; page-break-after: avoid; }
  h3 { font-size: 11.5pt; color: #24434a; margin: 16px 0 4px; page-break-after: avoid; }
  p { margin: 6px 0; }
  ul, ol { margin: 4px 0 8px; padding-left: 22px; }
  li { margin: 2px 0; }
  code { font-family: Consolas, "Cascadia Mono", monospace; font-size: 8.8pt; background: #eef3f4; padding: 0 3px; border-radius: 3px; }
  .code { margin: 8px 0 6px; border: 1px solid #d5dee0; border-radius: 4px; overflow: hidden; }
  .code.keep { break-inside: avoid; }
  .code .file { font: 600 8pt "Segoe UI", Arial, sans-serif; background: #dfeaec; color: #24434a; padding: 2px 8px; }
  pre { margin: 0; padding: 6px 8px; font: 8.3pt/1.4 Consolas, "Cascadia Mono", monospace; white-space: pre-wrap; word-break: break-word; background: #f7fafa; }
  pre.plain { border: 1px solid #d5dee0; border-radius: 4px; margin: 8px 0; break-inside: avoid; }
  .ln { color: #9aa9ad; user-select: none; }
  .gap { color: #9aa9ad; }
  table { border-collapse: collapse; margin: 8px 0; width: 100%; break-inside: avoid; font-size: 9.3pt; }
  th, td { border: 1px solid #cdd8da; padding: 3px 7px; text-align: left; vertical-align: top; }
  th { background: #e3eef0; }
  hr { border: none; border-top: 1px solid #cdd8da; margin: 18px 0; }
  .cover { text-align: center; padding-top: 70mm; }
  .cover h1 { border: none; font-size: 30pt; page-break-before: avoid; margin-bottom: 4px; }
  .cover .subtitle { font-size: 14pt; color: #3c5a60; }
  .cover .meta { margin-top: 30mm; color: #666; font-size: 10pt; }
  .toc { page-break-before: always; }
  .toc h1 { page-break-before: avoid; }
  .toc ul { list-style: none; padding-left: 0; }
  .toc li.main { font-weight: 600; margin-top: 8px; }
  .toc li.sub { padding-left: 18px; font-size: 9.5pt; }
  .toc a { color: #1d2329; text-decoration: none; }
  a { color: #0b5d6b; }
</style>
</head>
<body>
<div class="cover">
  <h1>nlT-Structures</h1>
  <div class="subtitle">Code walkthrough: what every file and every line does</div>
  <div class="meta">Paper plugin for Minecraft 26.3 and newer &nbsp;·&nbsp; author nlTarzan<br>
  Code excerpts are taken directly from the project's source files at the time this document was generated.</div>
</div>
<div class="toc">
  <h1>Contents</h1>
  <ul>
{{TOC}}
  </ul>
</div>
{{BODY}}
</body>
</html>
