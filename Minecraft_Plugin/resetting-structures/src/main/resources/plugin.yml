name: ResettingStructures
version: '${version}'
main: com.nltarzan.structures.ResettingStructures
api-version: '${apiVersion}'
description: Custom-built versions of vanilla structures that reset with a new random layout after a player has cleared them.
authors: [nlTarzan]

permissions:
  structures_admin:
    description: Use /structure and receive the structures' broadcast messages. Grant it with a permissions plugin such as LuckPerms.
    default: false
